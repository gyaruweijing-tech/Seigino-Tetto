<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1a1a">
<title>大股びらき男をキル</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1a1a1a;
    -webkit-tap-highlight-color:transparent; touch-action:none; overscroll-behavior:none; }
  #game { width:100%; height:100%; }
  #game canvas { display:block; }
  #rotate {
    display:none; position:fixed; inset:0; z-index:10;
    background:#1a1a1a; color:#fff5e0; flex-direction:column;
    align-items:center; justify-content:center; gap:20px; text-align:center;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; font-size:22px;
  }
  #rotate .icon { font-size:64px; animation:tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 0%,100%{transform:rotate(0)} 50%{transform:rotate(90deg)} }
  @media (orientation: portrait) { #rotate { display:flex; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate"><div class="icon">📱</div><div>横にしてください</div></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script src="src/audio.js"></script>
<script src="src/scenes/TitleScene.js"></script>
<script src="src/scenes/GameScene.js"></script>
<script src="src/scenes/GameOverScene.js"></script>
<script src="src/main.js"></script>
</body>
</html>
